[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-grid-pulse"
version = "1.0.0"
description = "DuckDB lakehouse for NEM prices, demand, renewable share, and illustrative data-centre load scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LuciferDataEngineer" }]
keywords = ["nem", "aemo", "duckdb", "dbt", "electricity", "data-engineering"]
dependencies = [
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
  "dagster>=1.8,<2",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nem-grid-pulse = "nem_grid_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/nem_grid_pulse/publication.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
