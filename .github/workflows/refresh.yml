name: refresh

on:
  schedule:
    # Monday 05:00 Australia/Sydney (AEST, UTC+10).
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pull new months if publishers are reachable
        run: python -m nem_grid_pulse ingest --allow-source-failure
      - name: Rebuild from whatever bronze is present
        run: make transform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bronze-manifest
          path: data/manifest.json
          if-no-files-found: warn
