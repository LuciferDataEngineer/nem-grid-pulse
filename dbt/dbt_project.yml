name: nem_grid_pulse
version: "1.0.0"
config-version: 2
profile: nem_grid_pulse
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  nem_grid_pulse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
